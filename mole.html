<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>두더지 잡기</title>
<style>
body{margin:0;min-height:100vh;background:#8bc34a;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;user-select:none}
h1{margin:16px 0 4px}
.bar{display:flex;gap:24px;font-size:20px;font-weight:bold;margin:8px}
.grid{display:grid;grid-template-columns:repeat(3,110px);gap:16px;margin:12px}
.hole{width:110px;height:110px;background:#5d4037;border-radius:50%;position:relative;overflow:hidden;box-shadow:inset 0 -10px 0 #3e2723;cursor:crosshair}
.mole{position:absolute;left:15px;bottom:-100px;width:80px;height:80px;background:#a1887f;border-radius:50% 50% 20% 20%;transition:bottom .12s;font-size:48px;text-align:center;line-height:80px}
.hole.up .mole{bottom:8px}
.hole.hit .mole{background:#ffeb3b}
button{font-size:18px;padding:8px 24px;border:0;border-radius:8px;background:#fff;cursor:pointer}
#msg{height:28px;font-weight:bold}
</style>
</head>
<body>
<h1>🔨 두더지 잡기</h1>
<div class="bar"><span>점수: <b id="score">0</b></span><span>최고: <b id="best">0</b></span><span>시간: <b id="time">30</b></span></div>
<div class="grid" id="grid"></div>
<div id="msg">시작 버튼을 누르세요</div>
<button id="start">시작</button>
<script>
const grid=document.getElementById('grid'),holes=[];
for(let i=0;i<9;i++){const h=document.createElement('div');h.className='hole';h.innerHTML='<div class="mole">🐹</div>';h.onpointerdown=()=>whack(i);grid.appendChild(h);holes.push(h)}
let score=0,time=30,playing=false,timers=[],best=+(localStorage.getItem('moleBest')||0);
const $=id=>document.getElementById(id);
$('best').textContent=best;
function whack(i){
  if(!playing||!holes[i].classList.contains('up'))return;
  holes[i].classList.remove('up');holes[i].classList.add('hit');
  setTimeout(()=>holes[i].classList.remove('hit'),150);
  $('score').textContent=++score;
}
function pop(){
  if(!playing)return;
  const down=holes.filter(h=>!h.classList.contains('up'));
  if(down.length){
    const h=down[Math.random()*down.length|0];
    h.classList.add('up');
    setTimeout(()=>h.classList.remove('up'),Math.max(350,900-score*15));
  }
  timers.push(setTimeout(pop,Math.max(250,800-score*12)));
}
function end(){
  playing=false;timers.forEach(clearTimeout);timers=[];
  holes.forEach(h=>h.classList.remove('up'));
  if(score>best){best=score;localStorage.setItem('moleBest',best);$('best').textContent=best}
  $('msg').textContent='게임 종료! 점수: '+score;$('start').disabled=false;
}
$('start').onclick=()=>{
  score=0;time=30;playing=true;$('score').textContent=0;$('time').textContent=time;
  $('msg').textContent='잡아라!';$('start').disabled=true;
  pop();
  const tick=()=>{if(!playing)return;$('time').textContent=--time;time<=0?end():timers.push(setTimeout(tick,1000))};
  timers.push(setTimeout(tick,1000));
};
</script>
</body>
</html>
